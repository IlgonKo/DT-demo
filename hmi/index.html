<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DT Demo 수동 운전</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/panel.js"></script>
</head>
<body>
  <main>
    <header><h1>DT Demo 수동 운전</h1><span class="tag">DT · 가상 X1/Y/Z</span></header>
    <p id="connection" role="status">상태 연결 중</p>
    <section>
      <h2>운전 상태</h2>
      <dl>
        <div><dt>시스템</dt><dd id="state">—</dd></div>
        <div><dt>조작 소스</dt><dd id="source">—</dd></div>
        <div><dt>제어권</dt><dd id="authority">—</dd></div>
        <div><dt>Pendant</dt><dd id="pendant">—</dd></div>
      </dl>
      <div class="actions">
        <button data-source="HMI" disabled>HMI 선택</button>
        <button data-source="Pendant" disabled>Pendant 선택</button>
        <button id="claim" disabled>제어권 획득</button>
        <button id="release" disabled>제어권 반납</button>
      </div>
      <div class="actions mode">
        <label for="pendant-mode">Pendant 모드</label>
        <select id="pendant-mode" disabled><option value="Single">단축 Jog</option><option value="Multi">다축 PV</option></select>
        <label for="pendant-axis">단축 대상</label>
        <select id="pendant-axis" disabled><option>X1</option><option>Y</option><option>Z</option></select>
      </div>
    </section>
    <section>
      <h2>가상 축</h2>
      <form id="move">
        <div class="axis-table">
          <table>
            <thead><tr><th>대상</th><th>위치 (mm)</th><th>속도 (mm/s)</th><th>상태</th><th>PP 목표 (mm)</th><th>축 조작</th></tr></thead>
            <tbody id="axes"></tbody>
          </table>
        </div>
        <div class="actions">
          <button id="enable-all" type="button" disabled>전체 Servo On</button>
          <button id="pp" disabled>선택 축 PP 실행</button>
        </div>
      </form>
      <div class="actions">
        <button id="stop" class="stop">공통 Stop</button>
        <button id="disable">전체 Servo Off</button>
        <button id="recover" disabled>Fault 해제</button>
      </div>
      <p id="pv" role="status" hidden></p>
      <p id="notice" role="status"></p>
      <p id="fault" role="alert"></p>
    </section>
  </main>
</body>
</html>
